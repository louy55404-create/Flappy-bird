<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Modern</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #1e1e2e, #0f0f17);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #ffffff;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 28px;
            color: #f5e0dc;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #313244;
        }

        canvas {
            display: block;
        }

        .instructions {
            margin-top: 16px;
            font-size: 14px;
            color: #a6adc8;
            text-align: center;
        }

        kbd {
            background-color: #313244;
            color: #cdd6f4;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #45475a;
        }
    </style>
</head>
<body>

    <h1>Flappy Bird Modern</h1>

    <div id="gameContainer">
        <canvas id="birdCanvas" width="360" height="500"></canvas>
    </div>

    <div class="instructions">
        Tekan <kbd>SPASI</kbd> atau <kbd>Klik Layar</kbd> untuk lompat
    </div>

    <script>
        const canvas = document.getElementById("birdCanvas");
        const ctx = canvas.getContext("2d");

        // Web Audio API untuk Efek Suara
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'flap') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'score') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // Note C5
                osc.frequency.setValueAtTime(659.25, now + 0.08); // Note E5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // Status Game
        const state = {
            current: 0,
            getReady: 0,
            game: 1,
            gameOver: 2
        };

        let frames = 0;
        let score = 0;
        let highScore = localStorage.getItem("flappy_highscore") || 0;

        // Awan
        const clouds = [
            { x: 50, y: 50, speed: 0.3, size: 0.8 },
            { x: 200, y: 100, speed: 0.5, size: 1.2 },
            { x: 300, y: 40, speed: 0.2, size: 0.6 }
        ];

        function drawClouds() {
            ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
            clouds.forEach(cloud => {
                ctx.beginPath();
                ctx.arc(cloud.x, cloud.y, 20 * cloud.size, 0, Math.PI * 2);
                ctx.arc(cloud.x + 15 * cloud.size, cloud.y - 10 * cloud.size, 15 * cloud.size, 0, Math.PI * 2);
                ctx.arc(cloud.x + 30 * cloud.size, cloud.y, 18 * cloud.size, 0, Math.PI * 2);
                ctx.fill();

                if (state.current === state.game) {
                    cloud.x -= cloud.speed;
                    if (cloud.x < -60) cloud.x = canvas.width + 40;
                }
            });
        }

        // Burung
        const bird = {
            x: 60,
            y: 200,
            radius: 13,
            gravity: 0.25,
            jump: 4.8,
            velocity: 0,
            rotation: 0,

            draw: function() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Rotasi berdasarkan kecepatan jatuh
                this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, (this.velocity * 4) * Math.PI / 180));
                ctx.rotate(this.rotation);

                // Badan Burung (Gradasi Kuning Keemasan)
                let grad = ctx.createRadialGradient(-2, -2, 2, 0, 0, this.radius);
                grad.addColorStop(0, "#fff066");
                grad.addColorStop(1, "#f1c40f");
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#d35400";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Sayap
                ctx.fillStyle = "#f39c12";
                ctx.beginPath();
                ctx.ellipse(-4, 2, 7, 4, Math.PI / 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Mata
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(4, -4, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#2c3e50";
                ctx.beginPath();
                ctx.arc(5, -4, 2, 0, Math.PI * 2);
                ctx.fill();

                // Paruh
                ctx.fillStyle = "#e67e22";
                ctx.beginPath();
                ctx.moveTo(8, -1);
                ctx.lineTo(17, 2);
                ctx.lineTo(8, 5);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            },

            flap: function() {
                this.velocity = -this.jump;
                playSound('flap');
            },

            update: function() {
                if (state.current === state.getReady) {
                    this.y = 200 + Math.sin(frames / 10) * 5; // Efek melayang halus
                    this.velocity = 0;
                } else {
                    this.velocity += this.gravity;
                    this.y += this.velocity;

                    if (this.y + this.radius >= canvas.height - 40) {
                        this.y = canvas.height - 40 - this.radius;
                        if (state.current === state.game) {
                            playSound('hit');
                            state.current = state.gameOver;
                        }
                    }

                    if (this.y - this.radius <= 0) {
                        this.y = this.radius;
                        this.velocity = 0;
                    }
                }
            },

            reset: function() {
                this.velocity = 0;
            }
        };

        // Pipa
        const pipes = {
            position: [],
            gap: 120,
            width: 52,
            dx: 2,

            draw: function() {
                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    let topYPos = p.y;
                    let bottomYPos = p.y + 300 + this.gap;

                    // Gradasi Warna Pipa
                    let grad = ctx.createLinearGradient(p.x, 0, p.x + this.width, 0);
                    grad.addColorStop(0, "#2ecc71");
                    grad.addColorStop(0.5, "#58d68d");
                    grad.addColorStop(1, "#27ae60");

                    ctx.fillStyle = grad;
                    ctx.strokeStyle = "#1e8449";
                    ctx.lineWidth = 2;

                    // Pipa Atas
                    ctx.fillRect(p.x, topYPos, this.width, 300);
                    ctx.strokeRect(p.x, topYPos, this.width, 300);
                    // Kepala Pipa Atas
                    ctx.fillRect(p.x - 3, topYPos + 300 - 20, this.width + 6, 20);
                    ctx.strokeRect(p.x - 3, topYPos + 300 - 20, this.width + 6, 20);

                    // Pipa Bawah
                    ctx.fillRect(p.x, bottomYPos, this.width, canvas.height - bottomYPos - 40);
                    ctx.strokeRect(p.x, bottomYPos, this.width, canvas.height - bottomYPos - 40);
                    // Kepala Pipa Bawah
                    ctx.fillRect(p.x - 3, bottomYPos, this.width + 6, 20);
                    ctx.strokeRect(p.x - 3, bottomYPos, this.width + 6, 20);
                }
            },

            update: function() {
                if (state.current !== state.game) return;

                if (frames % 100 === 0) {
                    this.position.push({
                        x: canvas.width,
                        y: -120 - Math.random() * 140
                    });
                }

                for (let i = 0; i < this.position.length; i++) {
                    let p = this.position[i];
                    let bottomPipeY = p.y + 300 + this.gap;

                    // Deteksi Tabrakan
                    if (bird.x + bird.radius > p.x && 
                        bird.x - bird.radius < p.x + this.width && 
                        (bird.y - bird.radius < p.y + 300 || bird.y + bird.radius > bottomPipeY)) {
                        playSound('hit');
                        state.current = state.gameOver;
                    }

                    p.x -= this.dx;

                    // Skor
                    if (p.x + this.width < bird.x && !p.passed) {
                        score += 1;
                        p.passed = true;
                        playSound('score');
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem("flappy_highscore", highScore);
                        }
                    }

                    if (p.x + this.width <= 0) {
                        this.position.shift();
                        i--;
                    }
                }
            },

            reset: function() {
                this.position = [];
            }
        };

        // Tanah & Latar Belakang
        function drawBackground() {
            // Gradasi Sky Blue
            let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, "#4facfe");
            skyGrad.addColorStop(0.8, "#00f2fe");
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawClouds();

            // Tanah
            ctx.fillStyle = "#d4ac0d";
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
            ctx.fillStyle = "#27ae60";
            ctx.fillRect(0, canvas.height - 40, canvas.width, 10);
            
            ctx.strokeStyle = "#1e8449";
            ctx.beginPath();
            ctx.moveTo(0, canvas.height - 40);
            ctx.lineTo(canvas.width, canvas.height - 40);
            ctx.stroke();
        }

        // Tampilan UI Panel Overlay
        function drawUI() {
            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "#2c3e50";
            ctx.lineWidth = 3;

            if (state.current === state.getReady) {
                ctx.font = "bold 22px sans-serif";
                ctx.textAlign = "center";
                ctx.strokeText("Siap Main?", canvas.width / 2, canvas.height / 2 - 20);
                ctx.fillText("Siap Main?", canvas.width / 2, canvas.height / 2 - 20);
                
                ctx.font = "14px sans-serif";
                ctx.fillText("Klik / Spasi untuk Mulai", canvas.width / 2, canvas.height / 2 + 20);
            } else if (state.current === state.gameOver) {
                // Background Card
                ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
                ctx.fillRect(30, canvas.height / 2 - 100, canvas.width - 60, 180);

                ctx.fillStyle = "#e74c3c";
                ctx.font = "bold 28px sans-serif";
                ctx.textAlign = "center";
                ctx.strokeText("GAME OVER", canvas.width / 2, canvas.height / 2 - 50);
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 50);
                
                ctx.fillStyle = "#ffffff";
                ctx.font = "16px sans-serif";
                ctx.fillText("Skor: " + score, canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillText("Skor Tertinggi: " + highScore, canvas.width / 2, canvas.height / 2 + 15);
                
                ctx.font = "13px sans-serif";
                ctx.fillStyle = "#f1c40f";
                ctx.fillText("Klik / Spasi untuk Main Lagi", canvas.width / 2, canvas.height / 2 + 55);
            } else {
                ctx.font = "bold 36px sans-serif";
                ctx.textAlign = "center";
                ctx.strokeText(score, canvas.width / 2, 50);
                ctx.fillText(score, canvas.width / 2, 50);
            }
        }

        // Input
        function handleInput() {
            initAudio();
            switch (state.current) {
                case state.getReady:
                    state.current = state.game;
                    bird.flap();
                    break;
                case state.game:
                    bird.flap();
                    break;
                case state.gameOver:
                    pipes.reset();
                    bird.reset();
                    score = 0;
                    state.current = state.getReady;
                    break;
            }
        }

        window.addEventListener("keydown", function(e) {
            if (e.code === "Space") {
                e.preventDefault();
                handleInput();
            }
        });

        canvas.addEventListener("click", function() {
            handleInput();
        });

        // Loop Game
        function loop() {
            drawBackground();

            bird.update();
            pipes.update();

            pipes.draw();
            bird.draw();
            drawUI();

            frames++;
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
